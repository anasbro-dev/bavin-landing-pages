<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f7f8fc" />
  <title>BAVIN — اختر منتجك</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app-shell selector">
    <header class="topbar">
      <span aria-hidden="true" style="width:42px"></span>
      <div class="brand">BAVIN</div>
      <span aria-hidden="true" style="width:42px"></span>
    </header>

    <section class="selector-hero">
      <span class="kicker">منتجات مختارة بعناية</span>
      <h1>اختر منتجك</h1>
      <p>منتجين مختارين بعناية — ادخل مباشرة للمنتج.</p>
    </section>

    <section class="selector-grid" aria-label="منتجات BAVIN">
      <article class="product-card blue">
        <div class="copy">
          <span class="badge">45W • GaN</span>
          <h2>شاحن Bavin</h2>
          <p>PC2132Y — PD 3.0</p>
          <div class="benefits">سريع • مدمج • USB-C</div>
          <a class="card-cta" href="charger.html">عرض المنتج</a>
        </div>
        <div class="visual" aria-hidden="true"><div class="mock-charger"></div></div>
      </article>

      <article class="product-card violet">
        <div class="copy">
          <span class="badge">Touch • ANC</span>
          <h2>سماعة Bavin</h2>
          <p>BAVIN-73 — شاشة لمس ذكية</p>
          <div class="benefits">شاشة • ANC • Find</div>
          <a class="card-cta" href="earbuds.html">عرض المنتج</a>
        </div>
        <div class="visual" aria-hidden="true"><div class="mock-earbuds"></div></div>
      </article>
    </section>
  </main>
</body>
</html>
